name: kreiseck_branding
description: >-
  Kreiseck Software Solutions Branding für Flutter – Logo-Widgets,
  Markenfarben und Assets, in jeder App einheitlich und frei einfärbbar.
version: 0.1.0
homepage: https://kreiseck.com
repository: https://github.com/mhmmdlkts/Kreiseck-Branding

environment:
  sdk: '>=3.2.3 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.3.0

dev_dependencies:
  flutter_lints: ^3.0.0

flutter:
  assets:
    - assets/kreiseck_logo.svg
    - assets/kreiseck_branding.png
    - assets/kreiseck_branding_dark.png
